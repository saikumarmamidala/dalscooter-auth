    Value: !Sub |
      REACT_APP_API_URL=https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
      REACT_APP_COGNITO_USER_POOL_ID=${UserPool}
      REACT_APP_COGNITO_CLIENT_ID=${UserPoolClient}
      REACT_APP_ENVIRONMENT=${Environment}

  TestInstructions:
