      1. REGISTER A USER:
         - Go to your React app registration page
         - Email: test@example.com
         - Password: TestPassword123!
         - Full Name: Test User
         - Security Question: What was your first pet's name?
         - Security Answer: Fluffy
         - Click Register
      
      2. LOGIN WITH 3-FACTOR AUTHENTICATION:
         - Step 1: Use email and password above
         - Step 2: Answer security question with "Fluffy"
         - Step 3: Solve the Caesar cipher challenge
         - Access dashboard upon successful authentication
      
      3. VERIFY SYSTEM:
         - Check email for registration/login notifications
